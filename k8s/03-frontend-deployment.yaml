apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tienda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        # Asegúrate de poner el nombre exacto de tu imagen de front en Docker Hub aquí:
        image: docker.io/darlinimiel/front-despacho:latest
        ports:
        - containerPort: 8080
---
  